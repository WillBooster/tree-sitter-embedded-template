[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "Embedded template (ERB, EJS) grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "embedded-template"]
license = "MIT"
name = "willbooster-tree-sitter-embedded-template"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-embedded-template"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = ["/bindings/rust/*", "/grammar.js", "/queries/*", "/src/*", "/tree-sitter.json", "/LICENSE"]

[lib]
name = "tree_sitter_embedded_template"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "7.0.5" }
